# apm.yml — agent-memory as an APM package (https://github.com/microsoft/apm).
#
# In this repo:        apm install                      # wires the hooks + skill below into .claude/
# In any other repo:   apm install dirien/agent-memory  # same hooks + skill, pointed at `bridge` on PATH
#
# Local primitives under .apm/, discovered automatically:
#   .apm/hooks/agent-memory.json      → SessionStart (sync + heartbeat), PostToolUse (index .md writes),
#                                       SessionEnd (log + suspend tasks), merged into .claude/settings.json
#   .apm/skills/agent-memory/SKILL.md → when to recall, remember, and hand off

name: agent-memory
version: 0.2.0
description: Elasticsearch as persistent semantic memory for Claude Code agents — hooks and a recall/remember skill for the bridge CLI.
author: Jeff Vestal (fork maintained by Engin Diri)
license: Apache-2.0
homepage: https://github.com/dirien/agent-memory
repository: https://github.com/dirien/agent-memory
keywords:
  - claude-code
  - elasticsearch
  - agent-memory

# The hooks use Claude Code events (SessionEnd, PostToolUse on Write/Edit).
target: claude

dependencies:
  mcp:
    # Agent Builder's MCP server in the project's Kibana: search, ES|QL and
    # index listing over the memory indices, with a read-only key from infra/.
    # Claude Code expands the placeholders from its process environment: load
    # the gitignored .mcp.env (scripts/write-env.sh) before starting claude, or
    # let Docker Sandboxes provide them (see kit/README.md).
    - name: elastic-memory
      registry: false
      transport: http
      url: "https://${ELASTIC_KIBANA_HOST}/api/agent_builder/mcp"
      headers:
        Authorization: "ApiKey ${ELASTIC_MCP_API_KEY}"

includes: auto
