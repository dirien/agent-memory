name: Publish kit

# Validate and publish kit/ to GitHub Container Registry as an OCI artifact:
# on kit changes on main (as :latest) and on version tags (as :vX.Y.Z). The
# built-in GITHUB_TOKEN can push packages; no extra secret needed.
on:
  push:
    branches: [main]
    paths:
      - kit/**
      - scripts/push-kit.sh
      - scripts/sbx-startup.sh
      - .github/workflows/publish-kit.yaml
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sbx_release:
        description: "docker/sbx-releases tag to install (must support kit-spec v2; 'latest' for the newest)"
        required: false
        default: "v0.46.0"
      tag:
        description: "OCI tag to publish"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  publish-kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # sbx is pinned, not "latest": since v0.47.0, `sbx kit validate` needs a running
      # daemon and an `sbx login`, neither of which this job has, so push-kit.sh fails
      # with "not signed in to Docker" (docker/sbx-releases#685). v0.46.0 is the last
      # release that validates offline. v0.49.1 adds `sbx kit validate --offline`;
      # moving to it also needs a check that `sbx kit push` works without a login.
      - name: Install sbx
        env:
          GH_TOKEN: ${{ github.token }}
          SBX_RELEASE: ${{ inputs.sbx_release || 'v0.46.0' }}
        run: |
          set -euo pipefail
          asset='DockerSandboxes-linux-amd64-ubuntu2604.deb'
          if [ "$SBX_RELEASE" = "latest" ]; then
            gh release download --repo docker/sbx-releases --pattern "$asset" --output /tmp/sbx.deb
          else
            gh release download "$SBX_RELEASE" --repo docker/sbx-releases --pattern "$asset" --output /tmp/sbx.deb
          fi
          sudo apt-get update
          sudo apt-get install -y /tmp/sbx.deb
          sbx version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push kit
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}" bash ./scripts/push-kit.sh
          fi
          TAG="${{ inputs.tag || 'latest' }}" bash ./scripts/push-kit.sh
