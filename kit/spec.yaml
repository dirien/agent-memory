schemaVersion: "2"
kind: mixin
name: elastic-memory
displayName: Elastic memory for Claude Code
description: >-
  Gives the Claude Code agent persistent memory in an Elasticsearch Serverless
  project, in any workspace: fetches the agent-memory CLI at a pinned ref,
  installs its hooks, skill and Elastic MCP server at user scope with APM, and
  allows egress to Elastic Cloud and your project's endpoints. Settings come in
  with `sbx create --env`, keys as proxy placeholders; no .env files. Stack it
  after the infrastructure kit, which brings APM (and Pulumi).
version: "0.2.2"
sourceURL: https://github.com/dirien/agent-memory
licenses:
  - Apache-2.0

# The hooks and skill are Claude Code specific.
requires:
  agent: claude

args:
  elastic_region:
    default: us-east-1.aws
    description: >-
      Region part of your project endpoints, <alias>.es.<elastic_region>.elastic.cloud
      (aws-us-east-1 in Pulumi config becomes us-east-1.aws here)
    pattern: '^[a-z0-9-]+\.(aws|gcp|azure)$'
  backend:
    default: local
    description: >-
      State backend for scripts/pulumi.sh when the workspace is an agent-memory
      clone. "local" keeps state in infra/.pulumi-state because the credential
      proxy breaks Pulumi Cloud updates (README: Known issue); "cloud" uses your
      Pulumi Cloud stack.
    enum: [local, cloud]
  agent_memory_dir:
    default: bundled
    description: >-
      Which agent-memory copy to install. "bundled" is the one this kit fetches
      at KIT_REF; "workspace" uses the primary workspace (an agent-memory clone
      you're developing); an absolute path uses a clone you mounted there.

# Egress allow-list. Serverless project hosts are <alias>-<id>.es.<region>.elastic.cloud,
# one label deep, so the single-label wildcards below are enforced.
permissions:
  network:
    allow:
      # Elastic Cloud control plane (project create/delete) and console
      - api.elastic-cloud.com
      - cloud.elastic.co
      # Your Serverless project: Elasticsearch + Kibana endpoints
      - "*.es.${{ kit.args.elastic_region }}.elastic.cloud"
      - "*.kb.${{ kit.args.elastic_region }}.elastic.cloud"
      # Pulumi service + the HCL plugin, and the ec / elasticstack providers
      # (bridged from the OpenTofu registry, binaries served from GitHub).
      # codeload.github.com also serves the agent-memory tarball below.
      - api.pulumi.com
      - get.pulumi.com
      - registry.opentofu.org
      - github.com
      - api.github.com
      - codeload.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      # jq/curl/openssl if the image lacks them, and npm for the Slidev deck
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - registry.npmjs.org

# Elastic Cloud API key, only for `pulumi up` in an agent-memory workspace. The
# value is bound on the host: `sbx secret set elastic-cloud`. The ec provider
# reads EC_API_KEY, which only holds the proxy-managed placeholder in the
# container; the proxy injects `Authorization: ApiKey <key>`.
credentials:
  - service: elastic-cloud
    description: "Elastic Cloud API key (creates the Serverless project via Pulumi)"
    required: false
    apiKey:
      name: EC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.elastic-cloud.com
          header: Authorization
          format: "ApiKey %s"

environment:
  variables:
    AGENT_MEMORY_BACKEND: "${{ kit.args.backend }}"
    # Serverless round trips from the sandbox proxy can exceed the 5s default.
    BRIDGE_TIMEOUT: "10"
    # bridge's online probe. Each proxied request takes about a second, and the
    # first one waits for sandboxd to resolve the key placeholder on the host;
    # with the 2s default the SessionStart heartbeat and memory sync skipped.
    BRIDGE_CHECK_TIMEOUT: "8"

setup:
  install:
    - user: "0"
      description: "Make sure the bridge CLI's dependencies (jq, curl, openssl) are installed"
      command: |
        set -eu
        missing=""
        for bin in jq curl openssl; do
          command -v "$bin" >/dev/null 2>&1 || missing="$missing $bin"
        done
        if [ -n "$missing" ]; then
          apt-get update -qq && apt-get install -y -qq $missing
        fi
    - user: "1000"
      description: "Fetch the agent-memory CLI, hooks and APM package at a pinned ref"
      command: |
        set -eu
        KIT_REPO="dirien/agent-memory"
        # Immutable ref to install. scripts/push-kit.sh rewrites it to the exact
        # commit SHA when publishing the kit to GHCR.
        KIT_REF="v0.2.2"
        DIR="$HOME/.local/share/agent-memory"
        if [ ! -x "$DIR/bridge" ]; then
          mkdir -p "$DIR"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
            "https://codeload.github.com/$KIT_REPO/tar.gz/$KIT_REF" \
            | tar -xz --strip-components=1 -C "$DIR"
        fi
        # Install the hooks now, so the first Claude session already has them.
        # setup.startup runs it again on every start (Docker reseeds ~/.claude),
        # but startup doesn't gate the agent, so it can lose that race.
        bash "$DIR/scripts/sbx-startup.sh" || true
  files:
    # Records the workspace path and which agent-memory copy to use, for the
    # startup step below.
    - path: /home/agent/.config/elastic-memory/workspace
      content: "${WORKDIR}"
      mode: "0644"
    - path: /home/agent/.config/elastic-memory/agent-memory-dir
      content: "${{ kit.args.agent_memory_dir }}"
      mode: "0644"
  startup:
    # Argv form (not shell-interpreted by the kit engine). Idempotent and non-fatal.
    # Runs on every start: Docker reseeds ~/.claude at create time.
    - user: "1000"
      description: "Put bridge on PATH and install the agent-memory hooks, skill and MCP server at user scope"
      command:
        - bash
        - -lc
        - |
          cfg="$HOME/.config/elastic-memory"
          am="$(cat "$cfg/agent-memory-dir" 2>/dev/null)"
          case "$am" in
            ""|bundled) am="$HOME/.local/share/agent-memory" ;;
            workspace)  am="$(cat "$cfg/workspace" 2>/dev/null)" ;;
          esac
          f="$am/scripts/sbx-startup.sh"
          if [ -f "$f" ]; then bash "$f"; else echo "[elastic-memory] no agent-memory copy at $am"; fi
          true

agentInstructions:
  content: |
    # Elastic memory

    This sandbox gives you persistent memory in an Elasticsearch Serverless
    project through the `bridge` CLI (on PATH) and the `elastic-memory` MCP
    server. Your context window resets between sessions; the memory does not.

    - Before re-deriving a decision or asking the user something they may have
      told an earlier session, run `bridge recall "<question>"` or query the
      `elastic-memory` MCP server.
    - Store decisions worth keeping: `bridge remember decision "<text>" --title "<title>"`.
    - `bridge status` shows connectivity and document counts; `bridge history`
      shows what earlier sessions did.
    - Hooks already sync your auto-memory, index every markdown file you write,
      and log the session end.

    Configuration comes from the environment (BRIDGE_ES_URL, BRIDGE_AGENT_ID,
    ELASTIC_KIBANA_HOST). BRIDGE_ES_API_KEY and ELASTIC_MCP_API_KEY hold proxy
    placeholders (`sbx-cs-…`); the proxy swaps in the real keys on the way out.
    Don't try to recover the real values, and don't write keys into files.
