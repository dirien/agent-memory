schemaVersion: "2"
kind: mixin
name: elastic-memory
displayName: Elastic memory for Claude Code
description: >-
  Gives the Claude Code agent persistent memory in an Elasticsearch Serverless
  project: egress to Elastic Cloud and your project's endpoints, the Elastic
  Cloud API key injected by the credential proxy, the bridge CLI on PATH, and
  the agent-memory hooks and skill wired in through APM. Stack it after the
  infrastructure kit, which brings Pulumi and APM.
version: "0.1.0"
sourceURL: https://github.com/dirien/agent-memory
licenses:
  - Apache-2.0

# The hooks and skill are Claude Code specific.
requires:
  agent: claude

args:
  elastic_region:
    default: us-east-1.aws
    description: >-
      Region part of your project endpoints, <alias>.es.<elastic_region>.elastic.cloud
      (aws-us-east-1 in Pulumi config becomes us-east-1.aws here)
    pattern: '^[a-z0-9-]+\.(aws|gcp|azure)$'
  backend:
    default: local
    description: >-
      State backend for scripts/pulumi.sh. "local" keeps state in
      infra/.pulumi-state because the credential proxy breaks Pulumi Cloud
      updates (README: Known issue); "cloud" uses your Pulumi Cloud stack.
    enum: [local, cloud]
  agent_memory_dir:
    default: workspace
    description: >-
      Where the agent-memory clone is mounted in the sandbox. "workspace" means
      the primary workspace is the clone. To give memory to another project,
      pass the clone's absolute path and mount it as a second workspace:
      sbx create ... claude <project> <agent-memory-clone>

# Egress allow-list. Serverless project hosts are <alias>-<id>.es.<region>.elastic.cloud,
# one label deep, so the single-label wildcards below are enforced.
permissions:
  network:
    allow:
      # Elastic Cloud control plane (project create/delete) and console
      - api.elastic-cloud.com
      - cloud.elastic.co
      # Your Serverless project: Elasticsearch + Kibana endpoints
      - "*.es.${{ kit.args.elastic_region }}.elastic.cloud"
      - "*.kb.${{ kit.args.elastic_region }}.elastic.cloud"
      # Pulumi service + the HCL plugin, and the ec / elasticstack providers
      # (bridged from the OpenTofu registry, binaries served from GitHub)
      - api.pulumi.com
      - get.pulumi.com
      - registry.opentofu.org
      - github.com
      - api.github.com
      - codeload.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      # jq/curl/openssl if the image lacks them, and npm for the Slidev deck
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - registry.npmjs.org

# Elastic Cloud API key for `pulumi up` in infra/. The value is bound on the host:
#   sbx secret set -g elastic-cloud
# The ec provider reads EC_API_KEY, which only holds the proxy-managed
# placeholder in the container; the proxy injects `Authorization: ApiKey <key>`.
credentials:
  - service: elastic-cloud
    description: "Elastic Cloud API key (creates the Serverless project via Pulumi)"
    required: false
    apiKey:
      name: EC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.elastic-cloud.com
          header: Authorization
          format: "ApiKey %s"

environment:
  variables:
    AGENT_MEMORY_BACKEND: "${{ kit.args.backend }}"
    # Serverless round trips from the sandbox proxy can exceed the 5s default.
    BRIDGE_TIMEOUT: "10"

setup:
  install:
    - user: "0"
      description: "Make sure the bridge CLI's dependencies (jq, curl, openssl) are installed"
      command: |
        set -eu
        missing=""
        for bin in jq curl openssl; do
          command -v "$bin" >/dev/null 2>&1 || missing="$missing $bin"
        done
        if [ -n "$missing" ]; then
          apt-get update -qq && apt-get install -y -qq $missing
        fi
  files:
    # Records where the workspace and the agent-memory clone are mounted, for
    # the startup step below.
    - path: /home/agent/.config/elastic-memory/workspace
      content: "${WORKDIR}"
      mode: "0644"
    - path: /home/agent/.config/elastic-memory/agent-memory-dir
      content: "${{ kit.args.agent_memory_dir }}"
      mode: "0644"
  startup:
    # Argv form (not shell-interpreted by the kit engine). Idempotent and non-fatal.
    - user: "1000"
      description: "Put bridge on PATH, deploy the agent-memory hooks with APM, write .env from the Pulumi stack"
      command:
        - bash
        - -lc
        - |
          cfg="$HOME/.config/elastic-memory"
          ws="$(cat "$cfg/workspace" 2>/dev/null)"
          am="$(cat "$cfg/agent-memory-dir" 2>/dev/null)"
          if [ -z "$am" ] || [ "$am" = "workspace" ]; then am="$ws"; fi
          f="$am/scripts/sbx-startup.sh"
          if [ -f "$f" ]; then bash "$f"; else echo "[elastic-memory] no agent-memory clone at $am"; fi
          true

agentInstructions:
  content: |
    # Elastic memory

    This sandbox gives you persistent memory in an Elasticsearch Serverless
    project through the `bridge` CLI (on PATH). Your context window resets
    between sessions; the memory does not.

    - Before re-deriving a decision or asking the user something they may have
      told an earlier session, run `bridge recall "<question>"`.
    - Store decisions worth keeping: `bridge remember decision "<text>" --title "<title>"`.
    - `bridge status` shows connectivity and document counts; `bridge history`
      shows what earlier sessions did.
    - Hooks already sync ~/.claude auto-memory at session start, index every
      markdown file you write, and log the session end.

    Infrastructure lives in `infra/` (Pulumi HCL, runtime: hcl). Run Pulumi
    through `scripts/pulumi.sh` (`scripts/pulumi.sh preview`, `... up`), not
    bare `pulumi`: with AGENT_MEMORY_BACKEND=local it keeps state in
    infra/.pulumi-state and pulls EC_API_KEY and the state passphrase from ESC.
    After `up`, run `scripts/write-env.sh` to write `.env`. Never print or
    commit `.env`; it holds the project API key.
