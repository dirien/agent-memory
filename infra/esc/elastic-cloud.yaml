# Pulumi ESC environment for the agent-memory stack (infra/Pulumi.dev.yaml imports it).
#
# Create it once, then replace the placeholders without the values touching
# shell history:
#
#   pulumi env init <org>/agent-memory/elastic-cloud -f infra/esc/elastic-cloud.yaml
#   read -rs EC_KEY && printf '%s' "$EC_KEY" | \
#     pulumi env set <org>/agent-memory/elastic-cloud elastic.apiKey --secret -f -
#   # only for the local state backend (AGENT_MEMORY_BACKEND=local):
#   openssl rand -base64 36 | tr -d '\n' | \
#     pulumi env set <org>/agent-memory/elastic-cloud state.passphrase --secret -f -
values:
  elastic:
    apiKey: REPLACE_WITH_ELASTIC_CLOUD_API_KEY
  # Encrypts secrets in infra/.pulumi-state when scripts/pulumi.sh runs with
  # AGENT_MEMORY_BACKEND=local. Ignored by Pulumi Cloud stacks.
  state:
    passphrase: REPLACE_WITH_A_RANDOM_PASSPHRASE
  # The ec provider reads EC_API_KEY; ESC exports both to `pulumi up`.
  environmentVariables:
    EC_API_KEY: ${elastic.apiKey}
    PULUMI_CONFIG_PASSPHRASE: ${state.passphrase}
